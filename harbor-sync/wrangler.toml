name = "harbor-sync"
main = "src/worker.ts"
compatibility_date = "2026-07-18"

# Optional: serve the Worker on your own domain (zone must exist on the account).
# routes = [{ pattern = "sync.example.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "harbor-sync"
# Replace with the ID printed by `wrangler d1 create harbor-sync`.
database_id = "00000000-0000-0000-0000-000000000000"
