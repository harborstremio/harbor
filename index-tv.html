<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // A television lays out on this canvas, settled by eye on a real panel
      // from a sofa. Fixed on purpose, never derived: apparent size across a
      // room is a fraction of the screen, not a pixel count. Deriving it from
      // the panel handed a 4K stick a 1920 desktop canvas and every row read
      // half size; a 4K set renders this canvas sharper, not smaller. Fire TV's
      // own 960 is the other end of the same mistake, small enough that the px
      // floors inside clamp() win and the layout reads as zoomed in.
      // 1080 was the first settled value; 1140 came from the row below the
      // focused one being clipped by the hint bar, which needs vertical room
      // rather than a layout change, because the rail parks the focused row at
      // the top and the next row peeks under the chrome.
      // Matched to bp-safe-area's detection. Both must agree on what a TV is.
      //
      // Never patch this at runtime to try a different size. Changing the
      // viewport on a live page leaves Big Picture's focus in a state where
      // every second move stalls for about three seconds, measured on a Stick
      // 4K Max. It is safe here only because it runs before the bundle boots.
      (function () {
        try {
          /* Bigger number means a wider CSS viewport, so everything on screen
             gets SMALLER, cards included. Briefly taken to 1280 to fix "too
             zoomed in" and reverted: the complaint was that content did not FIT,
             and shrinking the whole canvas also shrinks the posters, which is the
             opposite of what a ten-foot screen wants. The fit problem was the
             hero logo at 20vh by 64vw pushing the rows off the bottom; that is
             capped in bp-spotlight.tsx instead. Settled by eye, never derived. */
          var CANVAS = 1140;
          var ua = navigator.userAgent || "";
          var tv =
            /\bAFT[A-Z0-9]+\b/.test(ua) ||
            /Android ?TV|Google ?TV|SMART-?TV|Tizen|Web ?0S|WebOS|NetCast|BRAVIA|HbbTV|CrKey|VIDAA/i.test(
              ua,
            );
          if (!tv) return;
          if (Math.abs(CANVAS - window.innerWidth) < 48) return;
          var m = document.querySelector('meta[name="viewport"]');
          if (m) m.setAttribute("content", "width=" + CANVAS + ", viewport-fit=cover");
        } catch (e) {
          /* leave the authored viewport alone */
        }
      })();
    </script>
    <meta name="theme-color" content="#111214" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Harbor</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin />
    <link rel="preconnect" href="https://api.strem.io" crossorigin />
    <link rel="dns-prefetch" href="https://www.omdbapi.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <!-- media=print keeps these two off the render-blocking path. A remote
         stylesheet blocks the first paint of the whole document, and on a stick
         over wifi that was 1.5s of held frames before the boot splash below
         could show. Nothing paints text until React mounts seconds later, so
         the swap always lands long before a glyph is needed. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=sentient@400,500,600,700,401,501,601,701&f[]=switzer@400,500,600,700&f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Vazirmatn:wght@100..900&family=Inter:wght@100..900&family=IBM+Plex+Sans:wght@100..700&family=Plus+Jakarta+Sans:wght@100..800&family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      html, body, #root {
        background: var(--color-canvas, #111214);
        color-scheme: dark;
        margin: 0;
        height: 100%;
      }

      /* The boot splash is inline on purpose. Measured on a Fire TV Stick 4K
         Max: the html lands at 195ms and the first React paint at 9952ms, so
         anything owned by the bundle cannot cover the boot at all. #08090A is
         the same value android res/colors.xml paints as windowBackground, so
         the native starting window hands over to this with no seam. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(28px, 4.5vh, 64px);
        background: #08090a;
        pointer-events: none;
        transition: opacity 620ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot[data-leaving="true"] { opacity: 0; }
      #boot svg { display: block; }
      .boot-mark {
        width: min(24vw, 200px);
        color: #f3f3f3;
        animation: boot-mark-in 1200ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-spin {
        position: relative;
        display: block;
        width: clamp(34px, 4.4vh, 58px);
        height: clamp(34px, 4.4vh, 58px);
        animation: boot-spinner-in 900ms cubic-bezier(0.22, 1, 0.36, 1) 500ms both;
      }
      .boot-spin svg { width: 100%; height: 100%; }
      .boot-spin .arc {
        transform-origin: center;
        stroke-dasharray: 1, 126;
        animation:
          boot-spin 1300ms cubic-bezier(0.5, 0, 0.5, 1) infinite,
          boot-dash 2000ms ease-in-out infinite;
      }
      @keyframes boot-mark-in {
        0% { opacity: 0; transform: translate3d(0, 22px, 0) scale(0.94); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes boot-spinner-in {
        from { opacity: 0; transform: translate3d(0, 10px, 0); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-dash {
        0% { stroke-dasharray: 1, 126; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 90, 126; stroke-dashoffset: -22; }
        100% { stroke-dasharray: 1, 126; stroke-dashoffset: -125; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, .boot-mark, .boot-spin, .boot-spin .arc { animation: none; transition: none; }
        .boot-spin .arc { stroke-dasharray: 90, 126; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg class="boot-mark" viewBox="0 0 700 642.88" fill="currentColor">
        <g transform="matrix(0.13333333,0,0,-0.13333333,0,642.88)">
          <path d="m 72.0781,1534.27 c 0,0 1127.5819,922.03 1526.9319,2636.89 0,0 463.95,-1274.4 17.61,-2625.15 L 72.0781,1534.27" />
          <path d="M 3975.59,2945.05 2812.18,2222.26 c -36.68,-22.79 -84.13,3.59 -84.13,46.78 v 1391.45 c 0,42.35 45.8,68.85 82.51,47.75 l 1163.41,-668.68 c 36.11,-20.75 37,-72.53 1.62,-94.51 z M 2021.85,4821.57 V 1438.84 l 2818.94,416.96 c 0,0 252.54,2501.82 -2818.94,2965.77" />
          <path d="m 615.313,4.40234 c 0,0 -364.817,308.39866 -604.4224,706.25766 -28.3125,47.012 1.4922,107.77 55.8555,115.281 L 5090.13,1520.12 c 57.31,7.92 102.66,-47.69 82.95,-102.09 C 5065.81,1122 4746.77,351.742 4222.68,0 L 615.313,4.40234" />
        </g>
      </svg>
      <span class="boot-spin">
        <svg viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="25" r="20" stroke="#f3f3f3" stroke-opacity="0.12" stroke-width="3" />
          <circle
            class="arc"
            cx="25"
            cy="25"
            r="20"
            stroke="#e8a95c"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main-tv.tsx"></script>
  </body>
</html>
