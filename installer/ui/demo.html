<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harbor Setup, slideshow panels</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/motion.css" />
    <link rel="stylesheet" href="styles/screens/installing.css" />
    <style>
      body {
        width: auto;
        height: auto;
        display: block;
        padding: 22px 22px 40px;
        background: #0b0c0e;
        overflow: auto;
        user-select: text;
        font-family: var(--font-sans);
      }
      .d-wrap {
        max-width: 1180px;
        margin: 0 auto;
      }
      .d-top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .d-top h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .d-top p {
        margin: 4px 0 0;
        font-size: 12.5px;
        line-height: 18px;
        color: var(--ink-muted);
        max-width: 70ch;
      }
      .d-top code {
        font-family: var(--font-mono);
        color: var(--ink);
      }
      .d-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .d-bar button {
        height: 32px;
        padding: 0 14px;
        border-radius: var(--r-pill);
        font-family: var(--font-sans);
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-muted);
        background: var(--wash-quiet);
        box-shadow: inset 0 0 0 1px var(--edge-soft);
        cursor: pointer;
        white-space: nowrap;
      }
      .d-bar button:hover {
        color: var(--ink);
        background: var(--wash);
      }
      .d-bar button.on {
        color: var(--canvas);
        background: var(--accent);
        box-shadow: none;
      }

      .d-viewer {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        background: var(--canvas);
        box-shadow: inset 0 0 0 1px var(--edge-soft);
      }
      .d-slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 420ms var(--ease);
      }
      .d-slide.is-live {
        opacity: 1;
        pointer-events: auto;
      }
      .d-slide .hb-i-plate {
        opacity: 1;
      }
      .d-scrim {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: var(--scrim-art);
      }
      .d-cap {
        position: absolute;
        left: 46px;
        right: 46px;
        bottom: 40px;
        z-index: 3;
      }
      .d-cap i {
        display: block;
        font-style: normal;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .d-cap b {
        display: block;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.015em;
        line-height: 34px;
        color: var(--ink);
        margin-bottom: 6px;
      }
      .d-cap span {
        display: block;
        font-size: 14.5px;
        line-height: 21px;
        color: var(--ink-muted);
        max-width: 62ch;
      }

      .d-nav {
        position: absolute;
        top: 50%;
        z-index: 5;
        width: 46px;
        height: 46px;
        margin-top: -23px;
        border-radius: var(--r-pill);
        display: grid;
        place-items: center;
        color: var(--ink);
        background: oklch(0.18 0.004 260 / 0.72);
        box-shadow: inset 0 0 0 1px var(--edge-soft);
        cursor: pointer;
        transition: background-color var(--t-hover) var(--ease);
      }
      .d-nav:hover { background: oklch(0.18 0.004 260 / 0.92); }
      .d-prev { left: 18px; }
      .d-next { right: 18px; }
      .d-nav svg { width: 18px; height: 18px; }

      .d-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .d-dots {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .d-dot {
        width: 9px;
        height: 9px;
        border-radius: var(--r-pill);
        background: var(--wash);
        cursor: pointer;
        transition: background-color var(--t-hover) var(--ease), width var(--t-state) var(--ease);
      }
      .d-dot.on {
        width: 26px;
        background: var(--accent);
      }
      .d-count {
        font-size: 12.5px;
        color: var(--ink-subtle);
        font-variant-numeric: tabular-nums;
      }
      .d-count b {
        color: var(--ink);
        font-weight: 500;
      }

      body.no-scrim .d-scrim,
      body.no-scrim .d-cap,
      body.no-scrim
      body.no-drift .hb-i-drift { animation: none !important; }
      body.solo-art .hb-i-photo { display: none; }
    </style>
  </head>
  <body>
    <div class="d-wrap">
      <div class="d-top">
        <div>
          <h1>Slideshow panels</h1>
          <p>
            The art behind the installing screen, full size. Shapes live in
            <code>ui/screens/installing.js</code> and are styled under the <code>hb-i-</code> prefix
            in <code>ui/styles/screens/installing.css</code>. Arrow keys work.
          </p>
        </div>
        <div class="d-bar">
          <button id="t-scrim" type="button">Hide text</button>
          <button id="t-drift" type="button">Freeze drift</button>
          <button id="t-photo" type="button">Hide photos</button>
        </div>
      </div>

      <div class="d-viewer" id="viewer">
        <button class="d-nav d-prev" id="prev" type="button" aria-label="Previous panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg>
        </button>
        <button class="d-nav d-next" id="next" type="button" aria-label="Next panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"/></svg>
        </button>
      </div>

      <div class="d-foot">
        <div class="d-dots" id="dots"></div>
        <p class="d-count" id="count"></p>
      </div>
    </div>

    <script type="module">
      import { PANELS } from './screens/installing.js';

      const viewer = document.getElementById('viewer');
      const dotsEl = document.getElementById('dots');
      const countEl = document.getElementById('count');

      let manifest = { panels: [] };
      try {
        const r = await fetch('assets/slideshow/manifest.json');
        if (r.ok) manifest = await r.json();
      } catch (e) {
        manifest = { panels: [] };
      }

      const slides = PANELS.map((panel, i) => {
        const slide = document.createElement('div');
        slide.className = 'd-slide';

        const plate = document.createElement('div');
        plate.className = 'hb-i-plate is-live';

        const entry = (manifest.panels || [])[i];
        if (entry && entry.image) {
          const img = document.createElement('img');
          img.className = 'hb-i-photo';
          img.src = entry.image;
          img.alt = '';
          img.addEventListener('load', () => plate.classList.add('has-photo'));
          plate.appendChild(img);
        }

        const drift = document.createElement('div');
        drift.className = 'hb-i-drift';
        const shot = document.createElement('img');
        shot.className = 'hb-i-shot';
        shot.src = 'assets/slides/' + panel.shot;
        shot.alt = '';
        drift.appendChild(shot);
        plate.appendChild(drift);

        const scrim = document.createElement('div');
        scrim.className = 'd-scrim';

        const cap = document.createElement('div');
        cap.className = 'd-cap';
        cap.innerHTML = `<i>${panel.eyebrow}</i><b>${panel.headline}</b><span>${panel.support}</span>`;

        slide.append(plate, scrim, cap);
        viewer.appendChild(slide);
        return slide;
      });

      const dots = PANELS.map((panel, i) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'd-dot';
        dot.setAttribute('aria-label', panel.eyebrow);
        dot.addEventListener('click', () => show(i));
        dotsEl.appendChild(dot);
        return dot;
      });

      let index = 0;
      function show(next) {
        index = (next + PANELS.length) % PANELS.length;
        slides.forEach((s, i) => s.classList.toggle('is-live', i === index));
        dots.forEach((d, i) => d.classList.toggle('on', i === index));
        countEl.innerHTML = `<b>${String(index + 1).padStart(2, '0')}</b> of ${String(PANELS.length).padStart(2, '0')} &nbsp;&middot;&nbsp; ${PANELS[index].eyebrow}`;
      }

      document.getElementById('prev').addEventListener('click', () => show(index - 1));
      document.getElementById('next').addEventListener('click', () => show(index + 1));
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') show(index - 1);
        if (e.key === 'ArrowRight') show(index + 1);
      });

      const toggle = (id, cls) => {
        const btn = document.getElementById(id);
        btn.addEventListener('click', () => {
          const on = document.body.classList.toggle(cls);
          btn.classList.toggle('on', on);
        });
      };
      toggle('t-scrim', 'no-scrim');
      toggle('t-drift', 'no-drift');
      toggle('t-photo', 'solo-art');

      show(0);
    </script>
  </body>
</html>
