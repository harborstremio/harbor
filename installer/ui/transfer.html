<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harbor update handoff</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <style>
      :root {
        --canvas: oklch(0.18 0.004 260);
        --surface: oklch(0.22 0.004 260);
        --elevated: oklch(0.27 0.004 260);
        --raised: oklch(0.32 0.004 260);
        --ink: oklch(0.97 0.003 260);
        --ink-muted: oklch(0.72 0.003 260);
        --ink-subtle: oklch(0.65 0.003 260);
        --edge: oklch(0.36 0.004 260 / 0.55);
        --edge-soft: oklch(0.36 0.004 260 / 0.25);
        --accent: oklch(0.78 0.13 60);
        --ease: ease-in-out;
        --sans: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
        --mono: "JetBrains Mono", Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 18px;
        background: #0b0c0e;
        font-family: var(--sans);
        color: var(--ink);
      }

      .frame {
        position: relative;
        width: 1024px;
        height: 560px;
        margin: 0 auto;
        border-radius: 12px;
        background: var(--canvas);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .stage {
        position: relative;
        width: 640px;
      }
      .rail {
        position: relative;
        height: 132px;
        margin-bottom: 46px;
      }

      /* ---- a machine ---- */
      .box {
        position: absolute;
        top: 0;
        width: 132px;
      }
      .box.left {
        left: 0;
      }
      .box.right {
        right: 0;
      }

      .screen {
        position: relative;
        height: 92px;
        border-radius: 8px;
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--edge-soft);
        display: grid;
        place-items: center;
        transition: box-shadow 300ms var(--ease);
      }
      .glass {
        position: absolute;
        inset: 8px 8px 12px;
        border-radius: 4px;
        background: oklch(0.13 0.004 260);
        display: grid;
        place-items: center;
        transition: background-color 300ms var(--ease);
      }
      .ver {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--ink-subtle);
        opacity: 0.35;
        transition:
          opacity 300ms var(--ease),
          color 300ms var(--ease);
      }
      .neck {
        width: 16px;
        height: 9px;
        margin: 0 auto;
        background: var(--surface);
      }
      .base {
        width: 62px;
        height: 4px;
        margin: 0 auto;
        border-radius: 2px;
        background: var(--surface);
      }

      .box.on .screen {
        box-shadow: inset 0 0 0 1px var(--edge);
      }
      .box.on .glass {
        background: oklch(0.17 0.012 250);
      }
      .box.on .ver {
        opacity: 1;
        color: var(--ink);
      }
      .box.land {
        animation: land 420ms var(--ease) both;
      }
      @keyframes land {
        0% {
          transform: scale(1, 1);
        }
        38% {
          transform: scale(1.06, 0.94);
        }
        68% {
          transform: scale(0.98, 1.03);
        }
        100% {
          transform: scale(1, 1);
        }
      }

      .cable {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .cable path {
        fill: none;
        stroke: var(--edge-soft);
        stroke-width: 2;
      }
      .cable .lit {
        stroke: var(--accent);
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0.55;
      }

      .payload {
        position: absolute;
        top: 0;
        left: 0;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--accent);
        display: grid;
        place-items: center;
        offset-path: path("M 132 46 Q 320 78 508 46");
        offset-anchor: 50% 50%;
        offset-rotate: 0deg;
        offset-distance: 0%;
        opacity: 0;
      }

      .payload i {
        width: 15px;
        height: 15px;
        background: var(--canvas);
        -webkit-mask: url("assets/harbor-mark.svg") no-repeat center / contain;
        mask: url("assets/harbor-mark.svg") no-repeat center / contain;
      }

      .copy {
        text-align: center;
      }
      .phase {
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .detail {
        margin: 0;
        min-height: 18px;
        font-size: 12.5px;
        color: var(--ink-subtle);
      }
      .phase-in {
        animation: rise 300ms var(--ease) both;
      }
      @keyframes rise {
        0% {
          opacity: 0;
          transform: translateY(5px);
        }
        60% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ---- after relaunch ---- */
      .after {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--canvas);
        opacity: 0;
        pointer-events: none;
      }
      .after.show {
        opacity: 1;
      }
      .after-in {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .tick {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: oklch(1 0 0 / 0.05);
        color: var(--accent);
      }
      .tick svg {
        width: 22px;
        height: 22px;
      }

      .bar {
        display: flex;
        gap: 14px;
        align-items: center;
        width: 1024px;
        margin: 14px auto 0;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--surface);
      }
      .bar button {
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: var(--raised);
        color: var(--ink);
        font: 500 12.5px var(--sans);
        cursor: pointer;
      }
      .bar input {
        flex: 1;
        accent-color: var(--accent);
      }
      .bar code {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-subtle);
        min-width: 200px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="stage">
        <div class="rail">
          <svg class="cable" viewBox="0 0 640 132" aria-hidden="true">
            <path d="M 132 46 Q 320 78 508 46" />
            <path class="lit" id="lit" d="M 132 46 Q 320 78 508 46" pathLength="1" />
          </svg>

          <div class="box left on" id="boxL">
            <div class="screen">
              <div class="glass"><span class="ver">0.9.121</span></div>
            </div>
            <div class="neck"></div>
            <div class="base"></div>
          </div>

          <div class="box right" id="boxR">
            <div class="screen">
              <div class="glass"><span class="ver" id="verR">0.9.121</span></div>
            </div>
            <div class="neck"></div>
            <div class="base"></div>
          </div>

          <span class="payload" id="payload"><i></i></span>
        </div>

        <div class="copy">
          <p class="phase" id="phase">Getting ready</p>
          <p class="detail" id="detail">Closing background tasks</p>
        </div>
      </div>

      <div class="after" id="after">
        <div class="after-in">
          <span class="tick">
            <svg
              viewBox="0 0 22 22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5.2 11.6 L9.4 15.8 L16.8 7" />
            </svg>
          </span>
          <div>
            <p class="phase" style="margin: 0 0 2px">You are on 0.9.121</p>
            <p class="detail">Everything picked up where you left it</p>
          </div>
        </div>
      </div>
    </div>

    <div class="bar">
      <button id="play">Replay</button>
      <button id="toggleAfter">After restart</button>
      <input id="scrub" type="range" min="0" max="100" value="0" />
      <code id="read">0% · getting ready</code>
    </div>

    <script>
      const boxL = document.getElementById("boxL");
      const boxR = document.getElementById("boxR");
      const payload = document.getElementById("payload");
      const lit = document.getElementById("lit");
      const phase = document.getElementById("phase");
      const detail = document.getElementById("detail");
      const scrub = document.getElementById("scrub");
      const read = document.getElementById("read");
      const after = document.getElementById("after");

      let last = "";
      function say(title, sub) {
        if (title !== last) {
          last = title;
          phase.textContent = title;
          phase.classList.remove("phase-in");
          void phase.offsetWidth;
          phase.classList.add("phase-in");
        }
        detail.textContent = sub;
      }

      function render(p) {
        const pct = Math.max(0, Math.min(100, p));
        scrub.value = pct;

        // 0-14 ready | 14-76 travel | 76-88 land | 88-100 restart
        if (pct < 14) {
          payload.style.opacity = 0;
          payload.style.offsetDistance = "0%";
          lit.style.strokeDashoffset = 1;
          boxL.classList.add("on");
          boxR.classList.remove("on", "land");
          say("Getting ready", "Closing background tasks");
          read.textContent = Math.round(pct) + "% · getting ready";
          return;
        }

        if (pct < 76) {
          const k = (pct - 14) / 62;
          payload.style.opacity = k < 0.06 || k > 0.94 ? 0.35 : 1;
          payload.style.offsetDistance = (k * 100).toFixed(1) + "%";
          lit.style.strokeDashoffset = String(1 - k);
          boxL.classList.add("on");
          boxR.classList.remove("on", "land");
          say("Installing 0.9.121", "Swapping in the new build");
          read.textContent = Math.round(pct) + "% · installing";
          return;
        }

        if (pct < 88) {
          payload.style.opacity = 0;
          payload.style.offsetDistance = "100%";
          lit.style.strokeDashoffset = 0;
          boxL.classList.add("on");
          boxR.classList.add("on", "land");
          say("Installing 0.9.121", "Settings, library and addons stay put");
          read.textContent = Math.round(pct) + "% · landed";
          return;
        }

        payload.style.opacity = 0;
        lit.style.strokeDashoffset = 0;
        boxL.classList.remove("on");
        boxR.classList.add("on");
        say("Restarting Harbor", "Back in a second");
        read.textContent = Math.round(pct) + "% · restarting";
      }

      scrub.addEventListener("input", () => render(Number(scrub.value)));

      let raf = 0;
      document.getElementById("play").addEventListener("click", () => {
        cancelAnimationFrame(raf);
        after.classList.remove("show");
        last = "";
        boxR.classList.remove("land");
        const t0 = performance.now();
        const DUR = 2600;
        const step = () => {
          const p = Math.min(100, ((performance.now() - t0) / DUR) * 100);
          render(p);
          if (p < 100) raf = requestAnimationFrame(step);
        };
        step();
      });

      document.getElementById("toggleAfter").addEventListener("click", () => {
        after.classList.toggle("show");
      });

      render(0);
    </script>
  </body>
</html>
