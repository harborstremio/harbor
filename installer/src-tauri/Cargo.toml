[package]
name = "harbor-setup"
version = "0.9.124"
edition = "2021"
rust-version = "1.77"
default-run = "harbor-setup"

[features]
default = ["payload"]
payload = ["dep:zip", "dep:ureq", "dep:crc32fast"]

[[bin]]
name = "harbor-setup"
path = "src/main.rs"
required-features = ["payload"]

[[bin]]
name = "harbor-uninstall"
path = "src/uninstall_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harbor-install-recovery = { path = "../../harbor-install-recovery" }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
crc32fast = { version = "1", optional = true }
ureq = { version = "2", optional = true }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_System_Com_StructuredStorage",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
