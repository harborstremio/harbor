name: App build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
          - name: Linux
            runner: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xz-utils

      - name: Install macOS build dependencies
        if: matrix.platform.name == 'macOS'
        run: brew install mpv pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled sidecars
        run: pnpm run setup:binaries

      - name: Prepare Windows MPV runtime
        if: matrix.platform.name == 'Windows'
        shell: pwsh
        run: |
          pnpm run setup:libmpv

          $tag = '20260610'
          $asset = 'mpv-x86_64-20260610-git-304426c.7z'
          $sha256 = 'facac536baa73c7b925771af5e39a3c9cb16b8d75b59a6e9800de89799dffca7'
          curl.exe -L "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/$asset" -o mpv.7z
          if ((Get-FileHash mpv.7z -Algorithm SHA256).Hash -ne $sha256.ToUpper()) {
            throw 'MPV archive checksum mismatch'
          }
          7z x -y mpv.7z -ompv | Out-Null
          $mpv = (Get-ChildItem -Recurse mpv -Filter mpv.exe | Select-Object -First 1).FullName
          if (-not $mpv) { throw 'mpv.exe was not found in the archive' }
          Copy-Item $mpv src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe

      - name: Build app without installers
        run: pnpm tauri build --no-bundle
