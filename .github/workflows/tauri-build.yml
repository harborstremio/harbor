name: tauri-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build:
    name: ${{ matrix.platform.name }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - name: macOS-AppleSilicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - name: macOS-Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - name: Linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
          - name: Linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: contains(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libudev-dev \
            libmpv-dev \
            libpulse-dev \
            libgtk-3-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            patchelf \
            xdg-utils

      - name: Install Mac deps
        if: contains(matrix.platform.runner, 'macos')
        run: |
          brew install mpv pkg-config
          # Make pkg-config find libmpv from homebrew
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Verify HTTP redirect boundaries
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --manifest-path scripts/http-redirect-tests/Cargo.toml --locked --lib

      - name: Fetch libmpv (Windows)
        if: contains(matrix.platform.runner, 'windows')
        run: pnpm run setup:libmpv

      - name: Fetch mpv (Windows x64)
        if: matrix.platform.target == 'x86_64-pc-windows-msvc'
        run: pnpm run setup:mpv

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          TARGET="${{ matrix.platform.target }}"
          EXT=""
          if [[ "$TARGET" == *"windows"* ]]; then EXT=".exe"; fi

          echo "Downloading yt-dlp..."
          if [[ "$TARGET" == *"windows"* ]]; then
            curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-${TARGET}${EXT}"
          elif [[ "$TARGET" == *"apple"* ]]; then
            curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o "yt-dlp-${TARGET}${EXT}"
          else
            curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o "yt-dlp-${TARGET}${EXT}"
          fi
          chmod +x "yt-dlp-${TARGET}${EXT}" || true

          echo "Fetching ffmpeg and ffprobe..."
          if [[ "$TARGET" == *"windows"* ]]; then
            curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
            unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
            mv ffmpeg.exe "ffmpeg-${TARGET}${EXT}"
            mv ffprobe.exe "ffprobe-${TARGET}${EXT}"
          elif [[ "$TARGET" == *"apple"* ]]; then
            if [[ "$TARGET" == *"aarch64"* ]]; then
              curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://www.osxexperts.net/ffmpeg6arm.zip" -o ffmpeg.zip
              curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://www.osxexperts.net/ffprobe6arm.zip" -o ffprobe.zip
            else
              curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://www.osxexperts.net/ffmpeg6intel.zip" -o ffmpeg.zip
              curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://www.osxexperts.net/ffprobe6intel.zip" -o ffprobe.zip
            fi
            unzip ffmpeg.zip
            unzip ffprobe.zip
            mv ffmpeg "ffmpeg-${TARGET}${EXT}"
            mv ffprobe "ffprobe-${TARGET}${EXT}"
            chmod +x "ffmpeg-${TARGET}${EXT}" "ffprobe-${TARGET}${EXT}" || true
          else
            if [[ "$TARGET" == *"aarch64"* ]]; then
              curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz" -o ffmpeg.tar.xz
            else
              curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
            fi
            tar -xf ffmpeg.tar.xz --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            mv ffmpeg "ffmpeg-${TARGET}${EXT}"
            mv ffprobe "ffprobe-${TARGET}${EXT}"
          fi

      - name: harbor-core check
        working-directory: harbor-core
        run: |
          cargo check
          cargo test --all-targets

      - name: Detect signing key
        id: sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "config=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — building installers only, no signed updater artifacts."
          fi

      - name: Prepare bundled macOS libraries
        if: contains(matrix.platform.runner, 'macos')
        id: macos-libraries
        shell: bash
        run: |
          FRAMEWORKS_DIR="$RUNNER_TEMP/harbor-macos-frameworks-${{ matrix.platform.target }}"
          CONFIG_PATH="$RUNNER_TEMP/tauri-macos-libmpv-${{ matrix.platform.target }}.json"
          python3 scripts/macos-bundle-libmpv.py prepare \
            --frameworks "$FRAMEWORKS_DIR" \
            --config "$CONFIG_PATH"
          echo "HARBOR_MACOS_FRAMEWORKS_DIR=$FRAMEWORKS_DIR" >> "$GITHUB_ENV"
          echo "config=--config $CONFIG_PATH" >> "$GITHUB_OUTPUT"

      - name: Tauri build
        if: "!contains(matrix.platform.runner, 'ubuntu')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.platform.target }} ${{ steps.sign.outputs.config }} ${{ steps.macos-libraries.outputs.config }}

      - name: Build Linux system packages
        if: contains(matrix.platform.runner, 'ubuntu')
        run: pnpm tauri:build:linux-system --target ${{ matrix.platform.target }} --bundles deb,appimage

      - name: Build verified Windows managed installer
        if: matrix.platform.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $releaseRoot = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          New-Item -ItemType Directory -Force -Path 'src-tauri/target/release' | Out-Null
          Copy-Item -LiteralPath "$releaseRoot/harbor.exe" -Destination 'src-tauri/target/release/harbor.exe'
          cargo build --manifest-path installer/src-tauri/Cargo.toml --release --no-default-features --features tauri/custom-protocol --bin harbor-uninstall --locked
          if ($LASTEXITCODE -ne 0) { throw 'Uninstaller build failed' }
          node installer/scripts/make-payload.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Payload creation failed' }
          node scripts/verify-managed-payload.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Payload verification failed' }
          cargo build --manifest-path installer/src-tauri/Cargo.toml --release --features tauri/custom-protocol --bin harbor-setup --locked
          if ($LASTEXITCODE -ne 0) { throw 'Managed installer build failed' }
          node scripts/verify-managed-payload.mjs --embedded
          if ($LASTEXITCODE -ne 0) { throw 'Embedded payload verification failed' }
          foreach ($releaseExe in @('src-tauri/target/release/harbor.exe', 'installer/src-tauri/target/release/harbor-uninstall.exe', 'installer/src-tauri/target/release/harbor-setup.exe')) {
            if ((Get-Item -LiteralPath $releaseExe).VersionInfo.FileVersion -ne $releaseVersion) { throw "Wrong version: $releaseExe" }
          }
          New-Item -ItemType Directory -Force -Path "$releaseRoot/bundle/managed" | Out-Null
          Copy-Item -LiteralPath 'installer/src-tauri/target/release/harbor-setup.exe' -Destination "$releaseRoot/bundle/managed/Harbor_${releaseVersion}_x64-installer.exe"

      - name: Verify macOS app dependencies
        if: contains(matrix.platform.runner, 'macos')
        shell: bash
        run: |
          APP_PATH="$(find "src-tauri/target/${{ matrix.platform.target }}/release/bundle" -type d -name 'Harbor.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Harbor.app was not produced" >&2
            exit 1
          fi
          python3 scripts/macos-bundle-libmpv.py verify-app --app "$APP_PATH"

      - name: Archive verified macOS app for local updater signing
        if: contains(matrix.platform.runner, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.platform.target }}/release/bundle"
          APP_PATH="$(find "$BUNDLE" -type d -name 'Harbor.app' -print -quit)"
          test -n "$APP_PATH"
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json')).version")"
          ARCH="${{ matrix.platform.target }}"
          ARCH="${ARCH%%-*}"
          tar -czf "$BUNDLE/Harbor_${VERSION}_${ARCH}.app.tar.gz" -C "$(dirname "$APP_PATH")" Harbor.app

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*.sig
          retention-days: 14
          if-no-files-found: warn
