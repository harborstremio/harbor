# Builds the JL Media Vision Windows installer and Android TV app and publishes them as a
# GitHub release. The download site links to releases/latest/download/JL-Media-Vision-Setup-x64.exe
# and releases/latest/download/JL-Media-Vision-TV.apk.
# Start it by changing .github/jl-release (a one-line note) on the release branch, or by pushing
# a jl-v* tag. The release and its jl-v<version> tag are created on GitHub by tauri-action.
name: JL Release

on:
  workflow_dispatch:
  push:
    tags: ["jl-v*"]
    branches: ["claude/determined-planck-b1p158"]
    paths: [".github/jl-release"]

permissions:
  contents: write

concurrency:
  group: jl-release
  cancel-in-progress: false

# JL Media Vision accounts. Set in GitHub → Settings → Secrets and variables → Actions →
# Variables; nothing is written into the code. Without them the app builds, and its sign-in
# screen says accounts aren't set up.
env:
  VITE_JL_SUPABASE_URL: ${{ vars.JL_SUPABASE_URL }}
  VITE_JL_SUPABASE_ANON_KEY: ${{ vars.JL_SUPABASE_ANON_KEY }}

jobs:
  # Stops the release before anything is built or published when a GitHub setting is missing or
  # pasted into the wrong field.
  settings:
    name: Check release settings
    runs-on: ubuntu-latest
    steps:
      - name: Check variables and secrets
        env:
          KEYSTORE_B64: ${{ secrets.JL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JL_KEY_PASSWORD }}
        run: |
          ok=1
          if ! [[ "$VITE_JL_SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]]; then
            echo "::error::Variable JL_SUPABASE_URL must be the accounts project address (https://<project>.supabase.co)."
            ok=0
          fi
          if [ -z "$VITE_JL_SUPABASE_ANON_KEY" ] || [[ "$VITE_JL_SUPABASE_ANON_KEY" == https://* ]]; then
            echo "::error::Variable JL_SUPABASE_ANON_KEY must be the project's public (anon/publishable) key."
            ok=0
          fi
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret JL_${name} is empty."
              ok=0
            fi
          done
          if [ -n "$KEYSTORE_B64" ] && ! echo "$KEYSTORE_B64" | base64 -d > /dev/null 2>&1; then
            echo "::error::Secret JL_KEYSTORE_B64 is not valid base64 text."
            ok=0
          fi
          [ "$ok" = 1 ]

  windows:
    name: Windows x64
    needs: settings
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      tag: jl-v${{ steps.tauri.outputs.appVersion }}
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch libmpv
        run: pnpm run setup:libmpv

      - name: Fetch mpv
        run: pnpm run setup:mpv

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-${TARGET}.exe"
          curl --fail --location --retry 3 --retry-all-errors "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
          mv ffmpeg.exe "ffmpeg-${TARGET}.exe"
          mv ffprobe.exe "ffprobe-${TARGET}.exe"
          rm ffmpeg.zip

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.jl-dev.conf.json --bundles nsis
          tagName: jl-v__VERSION__
          commitish: ${{ github.sha }}
          releaseName: JL Media Vision v__VERSION__
          releaseBody: Windows installer for JL Media Vision. Download JL-Media-Vision-Setup-x64.exe and run it.
          releaseDraft: false
          prerelease: false

      - name: Upload stable-named installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setup=$(ls src-tauri/target/${TARGET}/release/bundle/nsis/*-setup.exe | head -1)
          cp "$setup" JL-Media-Vision-Setup-x64.exe
          gh release upload "jl-v${{ steps.tauri.outputs.appVersion }}" JL-Media-Vision-Setup-x64.exe --clobber --repo "${{ github.repository }}"

  android-tv:
    name: Android TV
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The signing key comes only from repository secrets, never from the repository. Keep the
      # same key for every release so each APK installs over the last one.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.JL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JL_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the JL_KEYSTORE_B64, JL_KEYSTORE_PASSWORD, JL_KEY_ALIAS and JL_KEY_PASSWORD repository secrets to sign the APK."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jl.keystore"
          { echo "JL_KEYSTORE_FILE=$RUNNER_TEMP/jl.keystore"; echo "JL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "JL_KEY_ALIAS=$KEY_ALIAS"; echo "JL_KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android-tv assembleRelease --no-daemon

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android-tv/app/build/outputs/apk/release/app-release.apk JL-Media-Vision-TV.apk
          gh release upload "${{ needs.windows.outputs.tag }}" JL-Media-Vision-TV.apk --clobber --repo "${{ github.repository }}"
